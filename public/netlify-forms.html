<!DOCTYPE html>
<html>
  <body>
    <!--
      This file exists so Netlify can detect the form at build time.
      The actual submission is done via fetch() from the React component.
    -->
    <form name="agrobee-preregister" method="POST" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="agrobee-preregister" />
      <input type="text"  name="bot-field" />
      <input type="text"  name="name" />
      <input type="email" name="email" />
      <input type="text"  name="phone" />
      <input type="text"  name="city" />
      <input type="text"  name="userType" />
      <input type="text"  name="userTypeOther" />
      <input type="text"  name="interests" />
      <input type="text"  name="products" />
      <input type="text"  name="productOther" />
      <input type="text"  name="activityLevel" />
      <textarea           name="goal"></textarea>
      <input type="text"  name="privacy" />
      <input type="text"  name="marketing" />
    </form>
  </body>
</html>
